# ============================================================
# GNC ekosistemi — nginx yapılandırması (gncinc.online)
# Port haritası: gnc-inc:3000 · gnc-erp:3001 · randevu:3002
#   kaloriai:3003 · fruitstorm:3004 · cubiq:3005 ·
#   petguardian:3006 · gridpop:3007
# ============================================================

# ---------- Ana site: www + kök ----------
server {
    listen 80;
    server_name gncinc.online www.gncinc.online;
    client_max_body_size 8m;
    location / { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

# ---------- GNC ERP / CRM ----------
server {
    listen 80;
    server_name crm.gncinc.online;
    client_max_body_size 16m;
    location / { proxy_pass http://127.0.0.1:3001; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

# ---------- Randevu (işletme wildcard alt alanları dahil) ----------
server {
    listen 80;
    server_name randevu.gncinc.online *.gncinc.online;
    client_max_body_size 8m;
    location / { proxy_pass http://127.0.0.1:3002; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

# ---------- KaloriAI ----------
server {
    listen 80;
    server_name kaloriai.gncinc.online;
    client_max_body_size 8m;
    location / { proxy_pass http://127.0.0.1:3003; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

# ---------- Fruit Storm ----------
server {
    listen 80;
    server_name fruitstorm.gncinc.online meyvepatlat.gncinc.online;
    client_max_body_size 8m;
    location / { proxy_pass http://127.0.0.1:3004; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

# ---------- Cubiq ----------
server {
    listen 80;
    server_name cubiq.gncinc.online;
    client_max_body_size 8m;
    location / { proxy_pass http://127.0.0.1:3005; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
}

# ---------- PetGuardian (Flutter statik) ----------
server {
    listen 80;
    server_name petguardian.gncinc.online;
    root /opt/gnc/petguardian/build/web;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

# ---------- GridPop (Flutter statik) ----------
server {
    listen 80;
    server_name gridpop.gncinc.online;
    root /opt/gnc/gridpop/build/web;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}

# Not: certbot --nginx her bloğa otomatik 443/SSL ekler (kurulum.sh çalıştırır).
